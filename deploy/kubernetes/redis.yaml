# Single-node Redis for token budgets. Budgets are short-lived counters, so
# persistence is off; use a managed or replicated Redis in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 320Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: inference
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
