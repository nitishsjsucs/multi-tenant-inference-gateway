# Gateway API Inference Extension InferencePool (inference.networking.k8s.io/v1,
# GIE v1.x). The gateway implementation sends each request for this pool
# through the endpoint picker and routes it to the pod the picker chose.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: llama-3-1-8b
  namespace: inference
  annotations:
    # Envoy AI Gateway: stream request/response bodies to the picker in
    # full-duplex mode (its default; cmd/epp requires it).
    aigateway.envoyproxy.io/processing-body-mode: duplex
spec:
  selector:
    matchLabels:
      app: vllm-llama-3-1-8b
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: mtig-epp
    kind: Service
    port:
      number: 9002
    failureMode: FailClose
